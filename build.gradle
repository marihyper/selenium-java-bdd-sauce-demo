plugins {
    id 'java'
}

group = 'com.saucedemo'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    selenideVersion = '7.5.1'
    cucumberVersion = '7.20.1'
    junitPlatformVersion = '1.11.3'
    webDriverManagerVersion = '5.9.3'
    assertjVersion = '3.26.3'
}

dependencies {
    // Selenide (Selenium wrapper) drives the browser.
    testImplementation "com.codeborne:selenide:${selenideVersion}"
    // Bonigarcia WebDriverManager resolves/updates the matching browser driver.
    testImplementation "io.github.bonigarcia:webdrivermanager:${webDriverManagerVersion}"
    // Cucumber-JVM (Gherkin BDD) running on the JUnit Platform.
    testImplementation "io.cucumber:cucumber-java:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-picocontainer:${cucumberVersion}"
    testImplementation "org.junit.platform:junit-platform-suite:${junitPlatformVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Choose the browser with -Dbrowser=chrome|firefox (default chrome).
    systemProperty 'browser', System.getProperty('browser', 'chrome')
    // Toggle headed runs with -Dselenide.headless=false.
    systemProperty 'selenide.headless', System.getProperty('selenide.headless', 'true')
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
    // Always re-run against the live site rather than caching as up-to-date.
    outputs.upToDateWhen { false }
}
